# ══════════════════════════════════════════════════
# FORMULAS — 跨系统引用的计算公式
# ══════════════════════════════════════════════════

formulas:

  speed_multiplier:
    source: design/gdd/talent-system.md
    expression: "1.0 + (talent_speed - 5) * 0.1"
    variables:
      talent_speed: "0-20"
    output_range: "0.5 - 2.5"
    referenced_by: [talent-system.md, cultivation-system.md]

  luck_multiplier:
    source: design/gdd/talent-system.md
    expression: "1.0 + (talent_luck - 5) * 0.1"
    variables:
      talent_luck: "0-20"
    output_range: "0.5 - 2.5"
    referenced_by: [talent-system.md, cultivation-system.md, story-system.md, economy.md]

  breakthrough_chance:
    source: design/gdd/cultivation-system.md
    expression: "clamp(REALM_BASE_CHANCE[realm] + (talent_luck - 5) * 0.04 + breakthrough_boost, 0.10, 0.95)"
    variables:
      realm: "0-4"
      talent_luck: "0-20"
      breakthrough_boost: "0.0 or 0.20"
    output_range: "0.10 - 0.95"
    referenced_by: [cultivation-system.md, talent-system.md]

  insight_rate:
    source: design/gdd/cultivation-system.md
    expression: "clamp(0.10 + (talent_luck - 5) * 0.02, 0.03, 0.30)"
    variables:
      talent_luck: "0-20"
    output_range: "0.03 - 0.30"
    note: "仅 retreat years >= 10 时有效"
    referenced_by: [cultivation-system.md, talent-system.md]

  cultivation_gain:
    source: design/gdd/cultivation-system.md
    expression: "(years * 8 + insight_value) * speed_multiplier"
    variables:
      years: "1+"
      insight_value: "0 or 50*luck_multiplier"
      speed_multiplier: "0.5-2.5"
    referenced_by: [cultivation-system.md]

  hidden_chance:
    source: design/gdd/economy.md
    expression: "prestige / (prestige + 100) * luck_multiplier"
    variables:
      prestige: "any int (can be negative)"
      luck_multiplier: "0.5-2.5"
    output_range: "0.0 - <luck_multiplier"
    referenced_by: [economy.md, story-system.md]

  family_init_gold:
    source: design/gdd/talent-system.md
    expression: "talent_family * 20"
    variables:
      talent_family: "0-20"
    output_range: "0 - 400"
    referenced_by: [talent-system.md, economy.md]

  family_passive_gold:
    source: design/gdd/talent-system.md
    expression: "talent_family * 5  (every 10 years)"
    variables:
      talent_family: "0-20"
    output_range: "0 - 100 per trigger"
    referenced_by: [talent-system.md, economy.md]

  family_request_gold:
    source: design/gdd/talent-system.md
    expression: "talent_family * 30  (30-year cooldown)"
    variables:
      talent_family: "0-20"
    output_range: "0 - 600"
    referenced_by: [talent-system.md, economy.md]

  lifespan_pill_bonus:
    source: design/gdd/economy.md
    expression: "max(0, 50 - lifespan_pill_used * 10)"
    variables:
      lifespan_pill_used: "0+"
    output_range: "50/40/30/20/10/0/0/..."
    referenced_by: [economy.md, cultivation-system.md]

  task_grade_percentage:
    source: design/gdd/task-system.md
    expression: "int(score / max_score * 100)"
    variables:
      score: "sum of step scores"
      max_score: "steps * 30 = 90"
    output_range: "0 - 100"
    referenced_by: [task-system.md]

  breakthrough_insight_chance:
    source: design/gdd/cultivation-system.md
    expression: "0.20 + (talent_luck - 5) * 0.02"
    variables:
      talent_luck: "0-20"
    note: "突破成功后的副骰，奖励 prestige+10 + 一阶聚灵丹"
    referenced_by: [cultivation-system.md]

  crush_gold_spare:
    source: design/gdd/story-system.md
    expression: "orig_best_gold * 1.5"
    variables:
      orig_best_gold: "事件中最高 gold 选项的值"
    referenced_by: [story-system.md]

  crush_gold_kill:
    source: design/gdd/story-system.md
    expression: "orig_best_gold * (2 + diff)"
    variables:
      orig_best_gold: "事件中最高 gold 选项的值"
      diff: "player_realm - event.suggested_realm"
    referenced_by: [story-system.md]

